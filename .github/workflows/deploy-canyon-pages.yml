name: Deploy Canyon Charms to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'example/canyon-charms/**'
      - 'scripts/**'
      - 'tools/generate-canyon-handbook.mjs'
      - 'docs/CLASSROOM_GUIDE_RU.md'
      - 'package.json'
      - '.github/workflows/deploy-canyon-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canyon-charms-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run repository tests
        run: npm test

      - name: Run static release checks
        run: npm run check -- --project example/canyon-charms

      - name: Build verified static game
        run: npm run build -- --project example/canyon-charms

      - name: Generate Russian student handbook
        run: >-
          node tools/generate-canyon-handbook.mjs
          --output example/canyon-charms/dist/student-handbook-ru.pdf

      - name: Add traceability and classroom source
        shell: bash
        run: |
          set -Eeuo pipefail
          dist='example/canyon-charms/dist'
          cp docs/CLASSROOM_GUIDE_RU.md "$dist/classroom-guide-ru.md"
          touch "$dist/.nojekyll"
          printf '{\n  "repository": "%s",\n  "commit": "%s",\n  "workflowRunId": "%s"\n}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > "$dist/build-info.json"

      - name: Validate deployable artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          dist='example/canyon-charms/dist'
          test -f "$dist/index.html"
          test -f "$dist/src/main.js"
          test -f "$dist/student-handbook-ru.pdf"
          test -s "$dist/student-handbook-ru.pdf"
          test -f "$dist/build-report.json"
          ! find "$dist" -type l -print -quit | grep -q .
          ! find "$dist" -type f -name '*.map' -print -quit | grep -q .
          printf 'deploy_bytes=%s\n' "$(du -sb "$dist" | cut -f1)"
          find "$dist" -type f -printf '%P %s bytes\n' | sort

      # One-time repository prerequisite:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The default GITHUB_TOKEN cannot perform first-time Pages enablement.
      - name: Read enabled GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: example/canyon-charms/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify public entrypoint and handbook
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$PAGE_URL" -o "$RUNNER_TEMP/canyon-charms.html"; then
              break
            fi
            [[ "$attempt" -lt 6 ]] || exit 1
            sleep 5
          done
          grep -F '<title>Canyon Charms</title>' "$RUNNER_TEMP/canyon-charms.html"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "${PAGE_URL%/}/student-handbook-ru.pdf" \
            -o "$RUNNER_TEMP/student-handbook-ru.pdf"
          test -s "$RUNNER_TEMP/student-handbook-ru.pdf"
          printf 'page_url=%s\n' "$PAGE_URL"
