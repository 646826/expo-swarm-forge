name: Diagnose Arkadium snapshot parts

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/arkadium-snapshot/**'
      - '.github/workflows/diagnose-arkadium-parts.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/vendor-arkadium-adapter
      - name: Recover the single missing Base64 character by reviewed digest
        shell: bash
        env:
          EXPECTED_SHA256: 320c33570a82cae554f5de184a527abd209647c06bc66a379647bb1efcfe5f10
        run: |
          set -Eeuo pipefail
          root=.bootstrap/arkadium-snapshot
          prefix="$RUNNER_TEMP/prefix.b64"
          suffix="$RUNNER_TEMP/suffix.b64"
          cat "$root/part-000" "$root/part-001" "$root/part-002" "$root/part-003" \
              "$root/part-004a" > "$prefix"
          cat "$root/part-004b" "$root/part-005" "$root/part-006" "$root/part-007" \
              > "$suffix"

          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          matched=''
          for (( index=0; index<${#alphabet}; index+=1 )); do
            character="${alphabet:index:1}"
            encoded="$RUNNER_TEMP/candidate.b64"
            output="$RUNNER_TEMP/candidate.tgz"
            cat "$prefix" > "$encoded"
            printf '%s' "$character" >> "$encoded"
            cat "$suffix" >> "$encoded"
            base64 --decode "$encoded" > "$output"
            digest="$(sha256sum "$output" | cut -d' ' -f1)"
            if [[ "$digest" == "$EXPECTED_SHA256" ]]; then
              tar -tzf "$output" > "$RUNNER_TEMP/archive-files.txt"
              matched="$character"
              printf 'RECOVERED_CHARACTER=%s\n' "$character"
              printf 'RECOVERED_ARCHIVE_BYTES=%s\n' "$(wc -c < "$output")"
              printf 'RECOVERED_ARCHIVE_SHA256=%s\n' "$digest"
              printf 'RECOVERED_ARCHIVE_FILES=%s\n' "$(wc -l < "$RUNNER_TEMP/archive-files.txt")"
              break
            fi
          done
          [[ -n "$matched" ]]
