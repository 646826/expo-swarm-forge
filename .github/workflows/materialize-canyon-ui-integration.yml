name: Materialize Canyon Charms UI integration

on:
  push:
    branches: [feat/canyon-ui-integration]
    paths:
      - '.github/workflows/materialize-canyon-ui-integration.yml'

permissions:
  contents: write

concurrency:
  group: materialize-canyon-ui-integration
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/canyon-ui-integration
          fetch-depth: 0

      - name: Apply deterministic UI wiring replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'example/canyon-charms/src/main.js';
          let source = readFileSync(path, 'utf8');

          function replaceOnce(label, before, after) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing replacement target: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Ambiguous replacement target: ${label}`);
            }
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }

          replaceOnce(
            'platform import',
            "import { createPublisherPlatform, createStorage } from './platform/platform.js';",
            "import { createCanyonIntegration } from './integration/runtime.js';\nimport { createStorage } from './platform/platform.js';",
          );

          replaceOnce(
            'platform construction',
            "const storage = createStorage();\nconst platform = createPublisherPlatform();\nlet settings = storage.load();",
            "const storage = createStorage();\nlet integration = null;\nlet settings = storage.load();",
          );

          replaceOnce(
            'start guard state',
            'let resumeAfterHelp = false;',
            'let resumeAfterHelp = false;\nlet startPending = false;',
          );

          replaceOnce(
            'diagnostics helpers',
            `function announce(message) {
            announcer.textContent = '';
            requestAnimationFrame(() => {
              announcer.textContent = message;
            });
          }
          `,
            `function announce(message) {
            announcer.textContent = '';
            requestAnimationFrame(() => {
              announcer.textContent = message;
            });
          }

          function syncIntegrationDiagnostics() {
            if (!integration) return;
            const diagnostics = integration.diagnostics();
            app.dataset.integrationPhase = diagnostics.phase;
            app.dataset.integrationEventCount = String(diagnostics.events.length);
            app.dataset.integrationLastEvent = diagnostics.events.at(-1)?.name ?? 'none';
          }

          async function trackIntegration(operation) {
            try {
              return await operation;
            } finally {
              syncIntegrationDiagnostics();
            }
          }

          function setSessionPaused(paused) {
            if (paused && mode === 'playing') {
              setMode('paused');
              announce('Game paused.');
            } else if (!paused && mode === 'paused') {
              setMode('playing');
              announce('Game resumed.');
              canvas.focus({ preventScroll: true });
            }
            queueMicrotask(syncIntegrationDiagnostics);
          }
          `,
          );

          replaceOnce(
            'start pause resume functions',
            `function startGame() {
            const nextSeed = (game.seed + game.turn + 0x9e37_79b9) >>> 0;
            game = createGame(nextSeed);
            selected = null;
            focused = 0;
            hint = null;
            flashes.clear();
            particles.length = 0;
            flyups.length = 0;
            setMode('playing');
            unlockAudio();
            tone(392, 0.08, 'triangle', 0.035);
            setTimeout(() => tone(523.25, 0.12, 'triangle', 0.04), 80);
            platform.started();
            platform.track('level_start', { seed: game.seed });
            announce('New game started. Reach five thousand points in twenty moves.');
            canvas.focus({ preventScroll: true });
          }

          function pauseGame() {
            if (mode !== 'playing') return;
            setMode('paused');
            suspendAudio();
            platform.paused();
            announce('Game paused.');
          }

          function resumeGame() {
            if (mode !== 'paused') return;
            setMode('playing');
            unlockAudio();
            platform.resumed();
            announce('Game resumed.');
            canvas.focus({ preventScroll: true });
          }
          `,
            `async function startGame() {
            if (startPending) return;
            if (integration?.phase === 'ended' || integration?.phase === 'destroyed') {
              location.reload();
              return;
            }

            startPending = true;
            try {
              const started = await trackIntegration(integration.startLevel('1'));
              if (!started.ok) return;

              const nextSeed = (game.seed + game.turn + 0x9e37_79b9) >>> 0;
              game = createGame(nextSeed);
              selected = null;
              focused = 0;
              hint = null;
              flashes.clear();
              particles.length = 0;
              flyups.length = 0;
              setMode('playing');
              unlockAudio();
              tone(392, 0.08, 'triangle', 0.035);
              setTimeout(() => tone(523.25, 0.12, 'triangle', 0.04), 80);
              announce('New game started. Reach five thousand points in twenty moves.');
              canvas.focus({ preventScroll: true });
            } finally {
              startPending = false;
            }
          }

          function pauseGame(source = 'player') {
            if (mode !== 'playing') return;
            void trackIntegration(integration.pause(source));
          }

          function resumeGame(source = 'player') {
            if (mode !== 'paused') return;
            void trackIntegration(integration.resume(source));
          }
          `,
          );

          replaceOnce(
            'completion integration',
            `  platform.submitScore(game.score);
            platform.completed({ status: game.status, score: game.score, moves: game.moves });
            platform.track('level_complete', { status: game.status, score: game.score, moves: game.moves });`,
            `  void trackIntegration(integration.complete({
              levelId: '1',
              result: game.status,
              reason: won ? 'completed' : 'lost',
              score: game.score,
              movesRemaining: game.moves,
            }));`,
          );

          replaceOnce(
            'rejected move integration',
            `    tone(126, 0.11, 'square', 0.018);
            announce('That swap does not create a match. The move was returned.');
            updateHud();`,
            `    tone(126, 0.11, 'square', 0.018);
            announce('That swap does not create a match. The move was returned.');
            void trackIntegration(integration.moveRejected({
              reason: result.reason,
              movesRemaining: game.moves,
            }));
            updateHud();`,
          );

          replaceOnce(
            'accepted move integration',
            `  platform.track('move_complete', {
            turn: game.turn,
            scoreDelta: delta,
            combo,
            moves: game.moves,
          });`,
            `  void trackIntegration(integration.moveAccepted({
            scoreDelta: delta,
            combo,
            movesRemaining: game.moves,
            totalScore: game.score,
          }));`,
          );

          replaceOnce(
            'keyboard restart',
            "  else if (key === 'r' && mode !== 'title') startGame();",
            "  else if (key === 'r' && mode !== 'title') void startGame();",
          );

          replaceOnce(
            'button start',
            "  if (action === 'start' || action === 'restart') startGame();",
            "  if (action === 'start' || action === 'restart') void startGame();",
          );

          replaceOnce(
            'visibility pause source',
            "  if (document.hidden && mode === 'playing') pauseGame();",
            "  if (document.hidden && mode === 'playing') pauseGame('visibility');",
          );

          replaceOnce(
            'boot integration',
            `function boot() {
            persist();
            updateHud();
            setMode('title');
            resizeCanvas();
            platform.loaded();
            void platform.connect();
            requestAnimationFrame(frame);
          }

          try {
            boot();
          } catch (error) {
            const panel = document.querySelector('[data-role="boot-error"]');
            panel.hidden = false;
            document.querySelector('[data-role="boot-error-message"]').textContent = error instanceof Error
              ? \`${'${error.name}: ${error.message}'}\`
              : String(error);
            throw error;
          }`,
            `async function boot() {
            persist();
            updateHud();
            setMode('title');
            resizeCanvas();
            integration = createCanyonIntegration({
              setPaused: setSessionPaused,
              suspendAudio,
              resumeAudio: unlockAudio,
              reportIntegrationError: announce,
            });
            const booted = await trackIntegration(integration.boot());
            if (!booted.ok) throw new Error(booted.error.message);
            requestAnimationFrame(frame);
          }

          function showBootError(error) {
            syncIntegrationDiagnostics();
            const panel = document.querySelector('[data-role="boot-error"]');
            panel.hidden = false;
            document.querySelector('[data-role="boot-error-message"]').textContent = error instanceof Error
              ? \`${'${error.name}: ${error.message}'}\`
              : String(error);
          }

          window.addEventListener('pagehide', () => {
            void integration?.destroy();
          });

          void boot().catch(showBootError);`,
          );

          if (source.includes('createPublisherPlatform')) {
            throw new Error('Legacy publisher constructor remains in main.js.');
          }
          if (/\bplatform\.(?:loaded|connect|started|paused|resumed|completed|submitScore|track)\b/.test(source)) {
            throw new Error('Direct legacy platform calls remain in main.js.');
          }

          writeFileSync(path, source);
          NODE

          node --check example/canyon-charms/src/main.js
          node --test --test-name-pattern='game UI|UI publishes' \
            example/canyon-charms/test/ui-integration-contract.test.js

      - name: Commit verified UI source wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add example/canyon-charms/src/main.js
          git diff --cached --check
          git commit -m 'feat: wire Canyon Charms UI to integration runtime'
          git push origin HEAD:feat/canyon-ui-integration
