name: Verify exact Arkadium Sandbox candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arkadium-sandbox-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: arkadium-sandbox
    outputs:
      telemetry_enabled: ${{ steps.runtime.outputs.telemetry_enabled }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PREVIEW_PATH: sandbox-candidates/${{ inputs.candidate_sha }}
      GAME_EYE_ENDPOINT: ${{ secrets.GAME_EYE_ENDPOINT }}
    steps:
      - name: Validate exact candidate SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Require trusted mainline candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main; then
            echo 'Candidate SHA is not reachable from the trusted main branch.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete repository verification
        run: npm run verify

      - name: Write optional protected telemetry official Sandbox runtime config
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const {
            appendFileSync,
            readFileSync,
            writeFileSync,
          } = require('node:fs');

          const source = process.env.GAME_EYE_ENDPOINT ?? '';
          let endpoint = null;
          if (source.length > 0) {
            if (source !== source.trim() || source.length > 2048) {
              throw new Error('Protected Game Eye endpoint is invalid.');
            }
            try {
              endpoint = new URL(process.env.GAME_EYE_ENDPOINT);
            } catch {
              throw new Error('Protected Game Eye endpoint is invalid.');
            }
            if (endpoint.protocol !== 'https:'
              || endpoint.username
              || endpoint.password
              || endpoint.hash) {
              throw new Error('Protected Game Eye endpoint is invalid.');
            }
          }

          const config = JSON.parse(
            readFileSync('config/runtime.sandbox.example.json', 'utf8'),
          );
          const officialConfig = {
            ...config,
            gameEyeEndpoint: endpoint ? endpoint.href : null,
            buildSha: process.env.CANDIDATE_SHA,
          };
          writeFileSync(
            'runtime.sandbox.official.json',
            `${JSON.stringify(officialConfig, null, 2)}\n`,
            'utf8',
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `telemetry_enabled=${endpoint ? 'true' : 'false'}\n`,
            'utf8',
          );
          NODE

      - name: Rebuild exact Arkadium candidate
        run: npm run build:arkadium -- --config runtime.sandbox.official.json --build-sha "$CANDIDATE_SHA"

      - name: Assemble SHA-addressed Pages preview
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/arkadium-sandbox-site"
          preview="$site/$PREVIEW_PATH"
          mkdir -p "$preview"
          cp -a example/canyon-charms/dist/. "$site/"
          cp -a example/canyon-charms/arkadium-dist/. "$preview/"
          touch "$site/.nojekyll"

          CANDIDATE_SHA="$CANDIDATE_SHA" PREVIEW="$preview" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');

          const root = process.env.PREVIEW;
          const manifest = JSON.parse(
            readFileSync(`${root}/runtime-manifest.json`, 'utf8'),
          );
          const report = JSON.parse(
            readFileSync(`${root}/candidate-report.json`, 'utf8'),
          );
          let expectedEndpoint = null;
          if (process.env.GAME_EYE_ENDPOINT) {
            try {
              expectedEndpoint = new URL(process.env.GAME_EYE_ENDPOINT).href;
            } catch {
              throw new Error('Deployed candidate endpoint identity is invalid.');
            }
          }
          assert.equal(manifest.mode, 'arkadium-sandbox');
          assert.equal(manifest.arkadiumEnvironment, 'DEV');
          if (manifest.gameEyeEndpoint !== expectedEndpoint) {
            throw new Error('Deployed candidate endpoint identity is invalid.');
          }
          assert.equal(manifest.buildSha, process.env.CANDIDATE_SHA);
          assert.equal(report.buildSha, process.env.CANDIDATE_SHA);
          assert.equal(report.sdkVersion, '2.66.2');
          NODE

          test -z "$(find "$site" -type l -print -quit)"
          test -z "$(find "$site" -type f -name '*.map' -print -quit)"

      - name: Read enabled GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload SHA-addressed Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/arkadium-sandbox-site

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact candidate preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  sandbox:
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    timeout-minutes: 20
    environment:
      name: arkadium-sandbox
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PREVIEW_PATH: sandbox-candidates/${{ inputs.candidate_sha }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      TELEMETRY_ENABLED: ${{ needs.prepare.outputs.telemetry_enabled }}
      GAME_EYE_ENDPOINT: ${{ secrets.GAME_EYE_ENDPOINT }}
      ARKADIUM_SANDBOX_AUTOMATION_JSON: ${{ secrets.ARKADIUM_SANDBOX_AUTOMATION_JSON }}
      ARK_EYE_CORRELATION_EVIDENCE_URL: ${{ secrets.ARK_EYE_CORRELATION_EVIDENCE_URL }}
      ARK_EYE_CORRELATION_EVIDENCE_TOKEN: ${{ secrets.ARK_EYE_CORRELATION_EVIDENCE_TOKEN }}
    steps:
      - name: Check out exact candidate evidence tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify deployed candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PAGE_URL"
          preview_url="${PAGE_URL%/}/$PREVIEW_PATH/"
          mkdir -p evidence/arkadium-sandbox
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "${preview_url}runtime-manifest.json" \
            -o "$RUNNER_TEMP/runtime-manifest.json"
          CANDIDATE_SHA="$CANDIDATE_SHA" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');

          const manifest = JSON.parse(
            readFileSync(
              process.env.RUNNER_TEMP + '/runtime-manifest.json',
              'utf8',
            ),
          );
          let expectedEndpoint = null;
          if (process.env.GAME_EYE_ENDPOINT) {
            try {
              expectedEndpoint = new URL(process.env.GAME_EYE_ENDPOINT).href;
            } catch {
              throw new Error('Deployed candidate endpoint identity is invalid.');
            }
          }
          assert.equal(manifest.mode, 'arkadium-sandbox');
          if (manifest.gameEyeEndpoint !== expectedEndpoint) {
            throw new Error('Deployed candidate endpoint identity is invalid.');
          }
          assert.equal(manifest.buildSha, process.env.CANDIDATE_SHA);
          NODE

      - name: Capture official Arkadium Sandbox evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ARKADIUM_SANDBOX_AUTOMATION_JSON"
          preview_url="${PAGE_URL%/}/$PREVIEW_PATH/"
          node scripts/capture-arkadium-sandbox-evidence.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --preview-url "$preview_url" \
            --output evidence/arkadium-sandbox

      - name: Verify official Sandbox evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          now_ms="$(date +%s%3N)"
          node scripts/verify-arkadium-sandbox-evidence.mjs \
            --directory evidence/arkadium-sandbox \
            --expected-build-sha "$CANDIDATE_SHA" \
            --expected-sdk-version 2.66.2 \
            --now-ms "$now_ms" \
            --max-age-ms 900000
          grep -F '"releaseState": "sandbox-verified"' \
            evidence/arkadium-sandbox/sandbox-verification.json

      - name: Decide protected telemetry correlation
        id: correlation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$TELEMETRY_ENABLED" = true ] \
            && [ -n "$GAME_EYE_ENDPOINT" ] \
            && [ -n "$ARK_EYE_CORRELATION_EVIDENCE_URL" ] \
            && [ -n "$ARK_EYE_CORRELATION_EVIDENCE_TOKEN" ]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            echo 'Protected telemetry correlation inputs are incomplete. Retaining sandbox-verified.'
          fi

      - name: Retrieve same-session Ark Eye correlation evidence
        if: steps.correlation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const UUID_V4 = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const MAX_EVIDENCE_BYTES = 256 * 1024;

          try {
            const status = JSON.parse(
              readFileSync(
                'evidence/arkadium-sandbox/sandbox-status.json',
                'utf8',
              ),
            );
            if (!status
              || typeof status !== 'object'
              || Array.isArray(status)
              || status.buildSha !== process.env.CANDIDATE_SHA
              || status.sdkVersion !== '2.66.2'
              || typeof status.sessionId !== 'string'
              || !UUID_V4.test(status.sessionId)) {
              throw new Error();
            }

            const source = process.env.ARK_EYE_CORRELATION_EVIDENCE_URL ?? '';
            if (source.length === 0
              || source !== source.trim()
              || source.length > 2048) {
              throw new Error();
            }
            let url;
            try {
              url = new URL(source);
            } catch {
              throw new Error();
            }
            if (url.protocol !== 'https:'
              || url.username
              || url.password
              || url.hash) {
              throw new Error();
            }
            url.searchParams.set('buildSha', status.buildSha);
            url.searchParams.set('sessionId', status.sessionId);
            url.searchParams.set('sdkVersion', status.sdkVersion);

            const response = await fetch(url, {
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${process.env.ARK_EYE_CORRELATION_EVIDENCE_TOKEN}`,
              },
              redirect: 'error',
              signal: AbortSignal.timeout(30_000),
            });
            const contentType = response.headers.get('content-type') ?? '';
            if (!response.ok
              || !/^application\/json(?:\s*;|$)/i.test(contentType)
              || !response.body) {
              throw new Error();
            }

            const reader = response.body.getReader();
            const chunks = [];
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              total += value.byteLength;
              if (total > MAX_EVIDENCE_BYTES) {
                await reader.cancel();
                throw new Error();
              }
              chunks.push(value);
            }
            if (total < 2) throw new Error();
            const bytes = new Uint8Array(total);
            let offset = 0;
            for (const chunk of chunks) {
              bytes.set(chunk, offset);
              offset += chunk.byteLength;
            }
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            const value = JSON.parse(text);
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              throw new Error();
            }
            writeFileSync(
              process.env.RUNNER_TEMP + '/ark-eye-correlation.json',
              text,
              { encoding: 'utf8', mode: 0o600 },
            );
          } catch {
            console.error('Ark Eye correlation evidence retrieval failed.');
            process.exit(1);
          }
          NODE

      - name: Verify protected Sandbox telemetry correlation
        if: steps.correlation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          now_ms="$(date +%s%3N)"
          node scripts/verify-correlated-telemetry-evidence.mjs \
            --directory evidence/arkadium-sandbox \
            --ark-eye-evidence "$RUNNER_TEMP/ark-eye-correlation.json" \
            --expected-build-sha "$CANDIDATE_SHA" \
            --expected-sdk-version 2.66.2 \
            --now-ms "$now_ms" \
            --max-age-ms 900000
          grep -F '"releaseState": "sandbox-telemetry-verified"' \
            evidence/arkadium-sandbox/correlated-telemetry-verification.json
          cp "$RUNNER_TEMP/ark-eye-correlation.json" \
            evidence/arkadium-sandbox/ark-eye-correlation.json

      - name: Upload official Sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arkadium-sandbox-evidence-${{ inputs.candidate_sha }}
          path: |
            evidence/arkadium-sandbox/sandbox-status.json
            evidence/arkadium-sandbox/sandbox-events.json
            evidence/arkadium-sandbox/rpc-diagnostics.json
            evidence/arkadium-sandbox/sandbox-console.log
            evidence/arkadium-sandbox/sandbox-page.png
            evidence/arkadium-sandbox/sandbox-verification.json
            evidence/arkadium-sandbox/ark-eye-correlation.json
            evidence/arkadium-sandbox/correlated-telemetry-verification.json
          if-no-files-found: warn
          retention-days: 14
