name: Materialize Canyon Charms clarity improvement

on:
  push:
    branches: [improve/canyon-clarity-quality]
    paths:
      - '.bootstrap/canyon-charms-clarity-quality.patch.gz.b64'
      - '.github/workflows/materialize-clarity-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/canyon-charms-clarity-quality.patch.gz.b64'
      - '.github/workflows/materialize-clarity-quality.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: improve/canyon-clarity-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Decode and validate patch
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .bootstrap/canyon-charms-clarity-quality.patch.gz.b64 \
            > "$RUNNER_TEMP/canyon-clarity.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/canyon-clarity.patch.gz" \
            > "$RUNNER_TEMP/canyon-clarity.patch"
          git apply --check "$RUNNER_TEMP/canyon-clarity.patch"
          git apply "$RUNNER_TEMP/canyon-clarity.patch"
          git diff --check

      - name: Verify complete repository candidate
        run: npm run verify

      - name: Confirm focused clarity contract
        run: node --test test/clarity-contract.test.js

      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-clarity-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: clarify Canyon Charms and strengthen verification'
          git push origin HEAD:improve/canyon-clarity-quality
