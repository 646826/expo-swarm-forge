name: Browser game starter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete repository verification
        run: npm run verify

      - name: Capture real standalone telemetry in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence

          node scripts/local-game-eye-fixture.mjs \
            > "$RUNNER_TEMP/canyon-telemetry-fixture.log" 2>&1 &
          fixture_pid=$!
          node scripts/serve.mjs example/canyon-charms/telemetry-dist 4173 \
            > "$RUNNER_TEMP/canyon-telemetry-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/runtime-manifest.json > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/telemetry-candidate-report.json > /dev/null; then
              break
            fi
            [[ "$attempt" -lt 30 ]] || {
              cat "$RUNNER_TEMP/canyon-telemetry-fixture.log" >&2
              cat "$RUNNER_TEMP/canyon-telemetry-server.log" >&2
              exit 1
            }
            sleep 1
          done

          npm run capture:telemetry -- \
            --url 'http://127.0.0.1:4173/?seed=12345&telemetryEvidence=1' \
            --expected-build-sha "$GITHUB_SHA" \
            --output evidence/local-browser-telemetry.json

          test -s evidence/local-browser-telemetry.json

          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const evidence = JSON.parse(readFileSync('evidence/local-browser-telemetry.json', 'utf8'));
          assert.equal(evidence.schemaVersion, 1);
          assert.equal(evidence.source, 'local-browser-telemetry-capture');
          assert.equal(evidence.expectedBuildSha, process.env.GITHUB_SHA);
          assert.equal(evidence.browser.title, 'Canyon Charms');
          assert.equal(evidence.browser.runtimeMode, 'standalone');
          assert.equal(evidence.browser.officialRuntimeRequests, 0);
          assert.ok(evidence.browser.gameEventPostCount >= 1);
          assert.equal(evidence.browser.consoleErrorCount, 0);
          assert.equal(evidence.interaction.initialMoves, 20);
          assert.equal(evidence.interaction.finalMoves, 19);
          assert.ok(evidence.interaction.scoreDelta >= 0);
          assert.equal(evidence.interaction.paused, true);
          assert.equal(evidence.interaction.resumed, true);
          assert.equal(evidence.telemetry.buildSha, process.env.GITHUB_SHA);
          assert.equal(evidence.telemetry.platformMode, 'standalone');
          assert.equal(evidence.telemetry.sdkVersion, null);
          assert.ok(evidence.telemetry.eventCount >= 1);
          assert.equal(evidence.telemetry.queueCount, 0);
          assert.equal(evidence.telemetry.droppedCount, 0);
          assert.equal(evidence.telemetry.inFlight, false);
          assert.equal(evidence.telemetry.lastDelivery.outcome, 'delivered');
          assert.equal(evidence.telemetry.lastDelivery.httpStatus, 202);
          assert.doesNotMatch(
            JSON.stringify(evidence),
            /endpoint|url|credential|authorization|access[_ -]?token|refresh[_ -]?token|password|cookie|profile|save[_ -]?payload|app[_ -]?insights|request[_ -]?id|transaction[_ -]?id/i,
          );
          NODE

      - name: Boot current Canyon Charms build in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/serve.mjs example/canyon-charms/dist 4173 \
            > "$RUNNER_TEMP/canyon-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            [[ "$attempt" -lt 30 ]] || {
              cat "$RUNNER_TEMP/canyon-server.log" >&2
              exit 1
            }
            sleep 1
          done

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser"
          url='http://127.0.0.1:4173/?seed=12345'

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1280,720 \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$url" \
            > "$RUNNER_TEMP/canyon-current-dom.html" \
            2> "$RUNNER_TEMP/canyon-current-chrome.log"

          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const html = readFileSync(process.env.RUNNER_TEMP + '/canyon-current-dom.html', 'utf8');
          assert.match(html, /<title>Canyon Charms<\/title>/);
          assert.match(html, /Canyon Charms board\. Score 0 of 5,000\./);
          assert.match(html, /data-reduced-motion="false"/);
          assert.match(html, /Three in a row/);
          assert.match(html, /data-integration-phase="ready"/);
          assert.match(html, /data-integration-last-event="sdk_ready"/);
          assert.match(html, /data-integration-event-count="3"/);
          const bootTag = html.match(/<[^>]+data-role="boot-error"[^>]*>/)?.[0] ?? '';
          assert.match(bootTag, /\shidden(?:="")?(?:\s|>)/);
          assert.doesNotMatch(html, /data-role="integration-debug"/);
          NODE

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1280,720 \
            --virtual-time-budget=5000 \
            --screenshot="$RUNNER_TEMP/canyon-current.png" \
            "$url" \
            >> "$RUNNER_TEMP/canyon-current-chrome.log" 2>&1

          test -s "$RUNNER_TEMP/canyon-current.png"

      - name: Inspect exact Arkadium candidate output
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const root = 'example/canyon-charms/arkadium-dist';
          const manifest = JSON.parse(readFileSync(`${root}/runtime-manifest.json`, 'utf8'));
          const report = JSON.parse(readFileSync(`${root}/candidate-report.json`, 'utf8'));
          assert.equal(manifest.mode, 'arkadium-sandbox');
          assert.equal(manifest.arkadiumEnvironment, 'DEV');
          assert.equal(manifest.buildSha, process.env.GITHUB_SHA);
          assert.equal(report.schemaVersion, 1);
          assert.equal(report.buildSha, process.env.GITHUB_SHA);
          assert.equal(report.sdkVersion, '2.66.2');
          assert.equal(report.runtimeMode, manifest.mode);
          assert.ok(report.files.some((file) => file.path === 'index.html'));
          assert.ok(report.files.some((file) => file.path === 'runtime-manifest.json'));
          assert.ok(report.files.every((file) => /^[0-9a-f]{64}$/.test(file.sha256)));
          NODE

          node scripts/serve.mjs example/canyon-charms/arkadium-dist 4174 \
            > "$RUNNER_TEMP/canyon-arkadium-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/runtime-manifest.json > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/candidate-report.json > /dev/null; then
              break
            fi
            [[ "$attempt" -lt 30 ]] || {
              cat "$RUNNER_TEMP/canyon-arkadium-server.log" >&2
              exit 1
            }
            sleep 1
          done

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser"
          url='http://127.0.0.1:4174/?seed=12345&integrationDebug=1'

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1280,720 \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$url" \
            > "$RUNNER_TEMP/canyon-arkadium-dom.html" \
            2> "$RUNNER_TEMP/canyon-arkadium-chrome.log"

          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const html = readFileSync(process.env.RUNNER_TEMP + '/canyon-arkadium-dom.html', 'utf8');
          assert.match(html, /<title>Canyon Charms<\/title>/);
          assert.match(html, /data-runtime-mode="arkadium-sandbox"/);
          assert.match(html, new RegExp(`data-runtime-build-sha="${process.env.GITHUB_SHA}"`));
          assert.match(html, /data-role="boot-error"/);
          const debugPanel = html.match(
            /<aside\b[^>]*data-role="integration-debug"[^>]*>[\s\S]*?<\/aside>/,
          )?.[0] ?? '';
          assert.match(debugPanel, /Arkadium integration/);
          assert.match(debugPanel, /Mode: arkadium-sandbox/);
          assert.match(debugPanel, /SDK: 2\.66\.2/);
          assert.match(debugPanel, /Game Eye queue:/);
          assert.doesNotMatch(debugPanel, /credential|access[_ -]?token|refresh[_ -]?token|password|profile|save[_ -]?payload|app[_ -]?insights|cookie|request[_ -]?id|transaction[_ -]?id/i);
          NODE

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1280,720 \
            --virtual-time-budget=5000 \
            --screenshot="$RUNNER_TEMP/canyon-arkadium.png" \
            "$url" \
            >> "$RUNNER_TEMP/canyon-arkadium-chrome.log" 2>&1

          test -s "$RUNNER_TEMP/canyon-arkadium.png"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canyon-charms-candidate-${{ github.sha }}
          path: |
            release/browser-game-starter.zip
            release/canyon-charms.zip
            example/canyon-charms/dist/build-report.json
            example/canyon-charms/dist/student-handbook-ru.pdf
            example/canyon-charms/arkadium-dist/
            example/canyon-charms/telemetry-dist/runtime-manifest.json
            example/canyon-charms/telemetry-dist/telemetry-candidate-report.json
            evidence/local-browser-telemetry.json
            ${{ runner.temp }}/canyon-current.png
            ${{ runner.temp }}/canyon-current-dom.html
            ${{ runner.temp }}/canyon-current-chrome.log
            ${{ runner.temp }}/canyon-arkadium.png
            ${{ runner.temp }}/canyon-arkadium-dom.html
            ${{ runner.temp }}/canyon-arkadium-chrome.log
          if-no-files-found: error
          retention-days: 7