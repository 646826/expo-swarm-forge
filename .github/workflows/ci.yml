name: Browser game starter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test
      - run: npm run check -- --project template/browser-game
      - run: npm run package -- --project template/browser-game
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-game-starter-${{ github.sha }}
          path: release/browser-game-starter.zip
          if-no-files-found: error
          retention-days: 7
