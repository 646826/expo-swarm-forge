name: Materialize Canyon UI integration on PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-canyon-ui-integration-pr.yml'
      - 'tools/materialize-canyon-ui-integration.mjs'

permissions:
  contents: write

concurrency:
  group: materialize-canyon-ui-integration-pr
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/canyon-ui-integration
          fetch-depth: 0

      - name: Apply and verify deterministic transform
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/materialize-canyon-ui-integration.mjs
          node --check example/canyon-charms/src/main.js
          node --test --test-name-pattern='game UI|UI publishes' \
            example/canyon-charms/test/ui-integration-contract.test.js

      - name: Commit source wiring when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- example/canyon-charms/src/main.js; then
            echo 'Source wiring already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add example/canyon-charms/src/main.js
          git diff --cached --check
          git commit -m 'feat: wire Canyon Charms UI to integration runtime'
          git push origin HEAD:feat/canyon-ui-integration
