name: Public preview smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-smoke.yml'
      - 'docs/CANYON_CHARMS_DELIVERY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify an immutable CDN preview
        shell: bash
        env:
          SOURCE_COMMIT: baf9e0f510b9434931673561603f1b9c5b994f2a
          GAME_PATH: example/canyon-charms
        run: |
          set -Eeuo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          verify_asset() {
            local base="$1"
            local relative_path="$2"
            local content_type_pattern="$3"
            local output="$tmp/$(printf '%s' "$relative_path" | tr '/' '_')"
            local headers="${output}.headers"

            if ! curl --fail --silent --show-error --location --retry 3 \
              --retry-all-errors --connect-timeout 15 --max-time 60 \
              -D "$headers" "${base}/${relative_path}" -o "$output"; then
              return 1
            fi

            tr -d '\r' < "$headers" > "${headers}.normalized"
            if ! grep -Eiq "^content-type:[[:space:]]*${content_type_pattern}" \
              "${headers}.normalized"; then
              printf 'Unexpected Content-Type for %s/%s\n' "$base" "$relative_path" >&2
              cat "${headers}.normalized" >&2
              return 1
            fi
            test -s "$output"
          }

          verify_provider() {
            local name="$1"
            local base="$2"
            printf 'Checking provider=%s base=%s\n' "$name" "$base"

            verify_asset "$base" index.html 'text/html'
            grep -F '<title>Canyon Charms</title>' "$tmp/index.html"
            grep -F './styles.css' "$tmp/index.html"
            grep -F './src/main.js' "$tmp/index.html"

            verify_asset "$base" styles.css 'text/css'
            verify_asset "$base" src/main.js '(text|application)/(javascript|ecmascript)'
            verify_asset "$base" src/core/random.js '(text|application)/(javascript|ecmascript)'
            verify_asset "$base" src/core/board.js '(text|application)/(javascript|ecmascript)'
            verify_asset "$base" src/core/game-state.js '(text|application)/(javascript|ecmascript)'
            verify_asset "$base" src/platform/platform.js '(text|application)/(javascript|ecmascript)'
          }

          rawcdn="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${SOURCE_COMMIT}/${GAME_PATH}"
          jsdelivr="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SOURCE_COMMIT}/${GAME_PATH}"
          verified=''

          if verify_provider rawcdn "$rawcdn"; then
            verified="${rawcdn}/index.html"
          elif verify_provider jsdelivr "$jsdelivr"; then
            verified="${jsdelivr}/index.html"
          else
            echo 'No immutable public preview provider passed HTTP and MIME checks.' >&2
            exit 1
          fi

          printf 'verified_preview_url=%s\n' "$verified"
          printf '%s\n' "$verified" >> "$GITHUB_STEP_SUMMARY"
