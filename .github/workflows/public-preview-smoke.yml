name: Public preview smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-smoke.yml'
      - 'docs/CANYON_CHARMS_DELIVERY.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Discover immutable CDN candidates
        shell: bash
        env:
          SOURCE_COMMIT: 709a1556fda3fa7a1506d46ec704cc654308775b
          GAME_PATH: example/canyon-charms
        run: |
          set -Eeuo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          candidates="$RUNNER_TEMP/canyon-preview-candidates.txt"
          : > "$candidates"

          verify_asset() {
            local provider="$1"
            local base="$2"
            local relative_path="$3"
            local content_type_pattern="$4"
            local safe_name
            safe_name="$(printf '%s_%s' "$provider" "$relative_path" | tr '/' '_')"
            local output="$tmp/$safe_name"
            local headers="${output}.headers"

            if ! curl --fail --silent --show-error --location --retry 3 \
              --retry-all-errors --connect-timeout 15 --max-time 60 \
              -D "$headers" "${base}/${relative_path}" -o "$output"; then
              printf 'provider=%s asset=%s status=http-failure\n' \
                "$provider" "$relative_path" >&2
              return 1
            fi

            tr -d '\r' < "$headers" > "${headers}.normalized"
            if ! grep -Eiq "^content-type:[[:space:]]*${content_type_pattern}" \
              "${headers}.normalized"; then
              printf 'provider=%s asset=%s status=invalid-content-type\n' \
                "$provider" "$relative_path" >&2
              grep -Ei '^(HTTP/|content-type:|x-content-type-options:)' \
                "${headers}.normalized" >&2 || true
              return 1
            fi
            test -s "$output"
          }

          verify_provider() {
            local name="$1"
            local base="$2"
            printf 'Checking provider=%s base=%s\n' "$name" "$base"

            verify_asset "$name" "$base" index.html 'text/html' || return 1
            grep -F '<title>Canyon Charms</title>' "$tmp/${name}_index.html" || return 1
            grep -F './styles.css' "$tmp/${name}_index.html" || return 1
            grep -F './clarity.css' "$tmp/${name}_index.html" || return 1
            grep -F './src/main.js' "$tmp/${name}_index.html" || return 1

            verify_asset "$name" "$base" styles.css 'text/css' || return 1
            verify_asset "$name" "$base" clarity.css 'text/css' || return 1
            verify_asset "$name" "$base" src/main.js '(text|application)/(javascript|ecmascript)' || return 1
            verify_asset "$name" "$base" src/core/random.js '(text|application)/(javascript|ecmascript)' || return 1
            verify_asset "$name" "$base" src/core/board.js '(text|application)/(javascript|ecmascript)' || return 1
            verify_asset "$name" "$base" src/core/game-state.js '(text|application)/(javascript|ecmascript)' || return 1
            verify_asset "$name" "$base" src/platform/platform.js '(text|application)/(javascript|ecmascript)' || return 1
            printf 'provider=%s status=asset-compatible\n' "$name"
          }

          add_candidate() {
            local name="$1"
            local base="$2"
            if verify_provider "$name" "$base"; then
              printf '%s|%s/index.html\n' "$name" "$base" >> "$candidates"
            fi
          }

          add_candidate staticdelivr \
            "https://cdn.staticdelivr.com/gh/${GITHUB_REPOSITORY}/${SOURCE_COMMIT}/${GAME_PATH}"
          add_candidate statically-at \
            "https://cdn.statically.io/gh/${GITHUB_REPOSITORY}@${SOURCE_COMMIT}/${GAME_PATH}"
          add_candidate statically-path \
            "https://cdn.statically.io/gh/${GITHUB_REPOSITORY}/${SOURCE_COMMIT}/${GAME_PATH}"
          add_candidate githubraw \
            "https://cdn.githubraw.com/${GITHUB_REPOSITORY}/${SOURCE_COMMIT}/${GAME_PATH}"
          add_candidate rawcdn \
            "https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${SOURCE_COMMIT}/${GAME_PATH}"
          add_candidate jsdelivr \
            "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SOURCE_COMMIT}/${GAME_PATH}"

          if [[ ! -s "$candidates" ]]; then
            echo 'No immutable provider passed HTTP and MIME checks.' >&2
            exit 1
          fi

          printf 'CANDIDATES_FILE=%s\n' "$candidates" >> "$GITHUB_ENV"
          printf 'Asset-compatible candidates:\n'
          cat "$candidates"

      - name: Select a provider that boots in headless Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$browser"

          evidence="$RUNNER_TEMP/canyon-preview-evidence"
          mkdir -p "$evidence"
          selected_provider=''
          selected_url=''

          verify_browser_boot() {
            local provider="$1"
            local preview_url="$2"
            local stem="$evidence/$provider"
            local dom="${stem}.html"
            local log="${stem}.log"
            local url="${preview_url}?seed=12345"

            printf 'Browser checking provider=%s url=%s\n' "$provider" "$url"
            if ! "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size=1280,720 \
              --virtual-time-budget=5000 \
              --dump-dom \
              "$url" > "$dom" 2> "$log"; then
              printf 'provider=%s status=chrome-command-failed\n' "$provider" >&2
              return 1
            fi

            if ! PROVIDER="$provider" DOM_FILE="$dom" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const html = readFileSync(process.env.DOM_FILE, 'utf8');
          assert.match(html, /<title>Canyon Charms<\/title>/);
          assert.match(html, /Canyon Charms board\. Score 0 of 5,000\./);
          assert.match(html, /data-reduced-motion="false"/);
          assert.match(html, /Three in a row/);
          const bootTag = html.match(/<[^>]+data-role="boot-error"[^>]*>/)?.[0] ?? '';
          assert.match(bootTag, /\shidden(?:="")?(?:\s|>)/);
          console.log(`provider=${process.env.PROVIDER} status=dom-booted`);
          NODE
            then
              printf 'provider=%s status=browser-incompatible\n' "$provider" >&2
              return 1
            fi

            local screenshot="${stem}.png"
            if ! "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size=1280,720 \
              --virtual-time-budget=5000 \
              --screenshot="$screenshot" \
              "$url" >> "$log" 2>&1; then
              return 1
            fi
            test -s "$screenshot"
          }

          while IFS='|' read -r provider preview_url; do
            if verify_browser_boot "$provider" "$preview_url"; then
              selected_provider="$provider"
              selected_url="$preview_url"
              cp "$evidence/${provider}.html" "$RUNNER_TEMP/canyon-preview-dom.html"
              cp "$evidence/${provider}.log" "$RUNNER_TEMP/canyon-preview-chrome.log"
              cp "$evidence/${provider}.png" "$RUNNER_TEMP/canyon-preview.png"
              break
            fi
          done < "$CANDIDATES_FILE"

          if [[ -z "$selected_url" ]]; then
            echo 'No asset-compatible provider booted the game in Chrome.' >&2
            exit 1
          fi

          printf 'browser=chrome provider=%s status=booted\n' "$selected_provider"
          printf 'verified_preview_url=%s\n' "$selected_url"
          printf '### Verified live preview\n\n%s\n' "$selected_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canyon-charms-public-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/canyon-preview.png
            ${{ runner.temp }}/canyon-preview-dom.html
            ${{ runner.temp }}/canyon-preview-chrome.log
            ${{ runner.temp }}/canyon-preview-evidence
          if-no-files-found: warn
          retention-days: 7
