name: Materialize reviewed Arkadium adapter

on:
  push:
    branches: [build/vendor-arkadium-adapter]
    paths:
      - '.bootstrap/arkadium-snapshot-v2/**'
      - '.github/workflows/materialize-arkadium-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/arkadium-snapshot-v2/**'
      - '.github/workflows/materialize-arkadium-adapter.yml'

permissions:
  contents: write

concurrency:
  group: materialize-arkadium-adapter
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/vendor-arkadium-adapter
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify and extract reviewed snapshot payload
        shell: bash
        env:
          SNAPSHOT_SHA256: b3d853e2b9cfe94d435473f0197ff217caa8088af7af5cf8024ab31ae30db300
        run: |
          set -Eeuo pipefail
          root=.bootstrap/arkadium-snapshot-v2
          expected=()
          for index in $(seq 0 12); do
            printf -v part '%s/part-%03d' "$root" "$index"
            expected+=("$part")
          done
          mapfile -t actual < <(find "$root" -maxdepth 1 -type f -name 'part-*' | sort)
          if (( ${#actual[@]} != ${#expected[@]} )); then
            printf 'Expected %s payload parts, found %s.\n' "${#expected[@]}" "${#actual[@]}" >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]] || {
              printf 'Unexpected payload part at index %s: %s\n' "$index" "${actual[$index]}" >&2
              exit 1
            }
            test -s "${expected[$index]}"
          done

          payload="$RUNNER_TEMP/arkadium-adapter-snapshot.tar.xz"
          cat "${expected[@]}" > "$payload"
          printf '%s  %s\n' "$SNAPSHOT_SHA256" "$payload" | sha256sum --check --strict

          while IFS= read -r path; do
            case "$path" in
              vendor/|vendor/arkadium-platform/|vendor/arkadium-platform/*) ;;
              *) printf 'Unexpected archive path: %s\n' "$path" >&2; exit 1 ;;
            esac
            case "/$path/" in
              */../*|*/./*) printf 'Unsafe archive path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(tar -tJf "$payload")
          if tar -tvJf "$payload" | awk '$1 ~ /^l/ { found=1 } END { exit(found ? 0 : 1) }'; then
            echo 'Snapshot archive contains a symbolic link.' >&2
            exit 1
          fi

          tar -xJf "$payload" -C .
          test -f vendor/arkadium-platform/manifest.json
          test -f vendor/arkadium-platform/SOURCE_EXPORT.md

      - name: Pin exact runtime and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          const sort = (value) => Object.fromEntries(
            Object.entries(value).sort(([a], [b]) => a.localeCompare(b, 'en')),
          );
          pkg.dependencies = sort({
            ...(pkg.dependencies ?? {}),
            '@arkadiuminc/sdk': '2.66.2',
          });
          pkg.devDependencies = sort({
            ...(pkg.devDependencies ?? {}),
            typescript: '6.0.3',
            vite: '8.1.5',
          });
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate direct dependency inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const directPackages = ['@arkadiuminc/sdk', 'typescript', 'vite'];
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const text = (value) => String(value ?? 'Not declared')
            .replaceAll('|', '\\|')
            .replaceAll('\n', ' ');
          const lines = [
            '# Direct Dependency Inventory',
            '',
            'Generated from installed package metadata and the exact npm lock. Missing metadata is reported, never invented.',
            '',
            '| Package | Version | License | Repository | Lock integrity |',
            '|---|---:|---|---|---|',
          ];
          for (const name of directPackages) {
            const metadata = JSON.parse(readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            const locked = lock.packages?.[`node_modules/${name}`] ?? {};
            const repository = typeof metadata.repository === 'string'
              ? metadata.repository
              : metadata.repository?.url;
            lines.push(
              `| \`${text(name)}\` | \`${text(metadata.version)}\` | ${text(metadata.license)} | ${text(repository)} | \`${text(locked.integrity)}\` |`,
            );
          }
          lines.push(
            '',
            '## Adapter provenance',
            '',
            '- Source repository: `646826/arkadium-game-factory`',
            '- Source commit: `020d3177a746f1fdd494a90bbd13d435e5905225`',
            '- Official Arkadium SDK: `2.66.2`',
            '- Source export workflow run: `31330517257`',
            '- Source export artifact: `9042779900`',
            '- Source archive SHA-256: `31c29a8f99b7157469684776bb6196b8b542a87dba502a5f22c0c10f943ed38e`',
            '- Reviewed snapshot archive SHA-256: `b3d853e2b9cfe94d435473f0197ff217caa8088af7af5cf8024ab31ae30db300`',
            '',
          );
          writeFileSync('vendor/arkadium-platform/LICENSES.md', `${lines.join('\n')}\n`);
          NODE

      - name: Verify snapshot, lock, and repository
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run arkadium:verify-snapshot
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.dependencies['@arkadiuminc/sdk'], '2.66.2');
          assert.equal(pkg.devDependencies.typescript, '6.0.3');
          assert.equal(pkg.devDependencies.vite, '8.1.5');
          assert.equal(lock.packages['node_modules/@arkadiuminc/sdk'].version, '2.66.2');
          assert.equal(lock.packages['node_modules/typescript'].version, '6.0.3');
          assert.equal(lock.packages['node_modules/vite'].version, '8.1.5');
          NODE
          npm run verify

      - name: Commit verified source snapshot and lock
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .bootstrap/arkadium-snapshot .bootstrap/arkadium-snapshot-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/arkadium-platform
          git add -u -- .bootstrap/arkadium-snapshot .bootstrap/arkadium-snapshot-v2
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(package\.json|package-lock\.json|vendor/arkadium-platform/|\.bootstrap/arkadium-snapshot(-v2)?/)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'build: vendor reviewed Arkadium adapter snapshot'
          git push origin HEAD:build/vendor-arkadium-adapter
